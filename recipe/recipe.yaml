context:
  version: 3.0.1

package:
  name: deeplabcut
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deeplabcut/deeplabcut-${{ version }}.tar.gz
  sha256: 4c33c8ff4dc15b26f7844945aef5542c2a0055c8ed663040e6ab8dd253e71a52
  patches:
    # https://github.com/DeepLabCut/DeepLabCut/commit/c8689e6d6b203339d1d68d6def3709ebe6787240
    - patches/0001-Move-imgaug-from-core-dependencies-to-TensorFlow-ext.patch
    # https://github.com/DeepLabCut/DeepLabCut/commit/1107360d59f813341b3222d71c15b3a79f899daa
    - patches/0002-Replace-NumPy-2.0-removed-array-APIs-with-supported-.patch
    # https://github.com/DeepLabCut/DeepLabCut/commit/252183c22d35fbf5577bc5e9aa4ebf81ab06e340
    - patches/0003-Estimate-tracklet-rank-with-a-dense-SVD-instead-of-i.patch
    - patches/0004-Use-qtpy-instead-of-PySide6.patch
    - patches/0005-Add-outputs-required-for-multi-animal-model-export.patch
    - patches/0006-Loosen-dependency-bounds.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - deeplabcut = deeplabcut.gui.launch_script:launch_dlc

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}
    - albumentations >=1.4,<1.4.4
    - dlclibrary >=0.0.12
    - einops
    - filelock >=3.12
    - filterpy >=1.4.4
    - huggingface_hub >=0.23
    - imageio-ffmpeg
    - matplotlib-base >=3.3,!=3.7.0,!=3.7.1
    - networkx >=2.6
    - numba >=0.54
    - numpy >=1.22.4
    - opencv
    - packaging >=20
    - pandas >=2.2
    - bottleneck
    - numexpr
    - pillow >=7.1
    - pycocotools
    - pydantic >=2
    - pytables >=3.8.0
    - pytorch >=2
    - pyyaml
    - ruamel.yaml >=0.15.0
    - scikit-image >=0.17
    - scikit-learn >=1.0
    - scipy >=1.10
    - statsmodels >=0.11
    - timm
    - torchvision
    - tqdm
  run_constraints:
    - napari-deeplabcut >=0.2.1.6
    - qtpy >=2.0
    - tensorflow >=2.12
    - imgaug >=0.4
    - tensorpack >=0.11
    - tf_slim >=1.1

tests:
  - script:
      - pip check
      - python -c "import deeplabcut"
      - python -c "import deeplabcut; deeplabcut.create_new_project"
      - python -c "import numpy; print(numpy.__version__); assert numpy.__version__.split('.')[0] == '2'"
      - python -c "import albumentations as A; A.keypoint_scale"
      - python -c "import numpy as np; from deeplabcut.pose_estimation_pytorch.data.transforms import build_transforms; t = build_transforms(dict(resize=dict(height=64, width=64, keep_ratio=True), normalize_images=True)); r = t(image=np.zeros((80, 50, 3), dtype=np.uint8), keypoints=[(10.0, 10.0)], class_labels=[0], bboxes=[], bbox_labels=[]); assert r['image'].shape[:2] == (64, 64); print('transforms ok', r['keypoints'])"
      - python -c "from deeplabcut.refine_training_dataset.stitch import Tracklet"
      - dlc --help
    requirements:
      run:
        - pip
        - python ${{ python_min }}.*
        - numpy >=2
        - opencv *headless*

about:
  license: LGPL-3.0-or-later
  license_file: LICENSE
  summary: DeepLabCut is a toolbox for markerless pose estimation of animals performing various tasks.
  homepage: https://www.deeplabcut.org
  repository: https://github.com/DeepLabCut/DeepLabCut

extra:
  recipe-maintainers:
    - hmaarrfk
