context:
  version: 3.0.1

package:
  name: deeplabcut
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/deeplabcut/deeplabcut-${{ version }}.tar.gz
  sha256: 4c33c8ff4dc15b26f7844945aef5542c2a0055c8ed663040e6ab8dd253e71a52
  patches:
    # https://github.com/DeepLabCut/DeepLabCut/commit/c8689e6d6b203339d1d68d6def3709ebe6787240
    - patches/0001-Move-imgaug-from-core-dependencies-to-TensorFlow-ext.patch
    # https://github.com/DeepLabCut/DeepLabCut/commit/1107360d59f813341b3222d71c15b3a79f899daa
    - patches/0002-Replace-NumPy-2.0-removed-array-APIs-with-supported-.patch
    # https://github.com/DeepLabCut/DeepLabCut/commit/252183c22d35fbf5577bc5e9aa4ebf81ab06e340
    - patches/0003-Estimate-tracklet-rank-with-a-dense-SVD-instead-of-i.patch
    # https://github.com/DeepLabCut/DeepLabCut/commit/aafaa2e77a1f6f1a4c0d6ad3d4d9ba0e5e1a0a2d
    - patches/0004-Guard-CoW-read-only-.to_numpy-.values-mutations-3362.patch
    # https://github.com/DeepLabCut/DeepLabCut/commit/18bc897c
    - patches/0005-Guard-remaining-CoW-read-only-.to_numpy-.values-mutat.patch
    # https://github.com/DeepLabCut/DeepLabCut/commit/7c997771a5326588363563306be2d9a9cdea5ed0
    - patches/0006-Add-copy-True-to-to_numpy-in-evaluate_multianimal-pea.patch
    - patches/0007-Use-qtpy-instead-of-PySide6.patch
    - patches/0008-Add-outputs-required-for-multi-animal-model-export.patch
    - patches/0009-Loosen-dependency-bounds.patch
    - patches/0010-Replace-albumentations-with-a-vendored-augmentation-.patch
    - patches/0011-Fix-Path-str-confusion-left-over-from-the-pathlib-mi.patch
    - patches/0012-Release-the-TensorFlow-session-when-video-analysis-f.patch
    - patches/0013-Use-batch-norm-moving-averages-at-inference-in-the-M.patch
    - patches/0014-Make-MobileNet-inference-independent-of-batch-compos.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - deeplabcut = deeplabcut.gui.launch_script:launch_dlc

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}
    - dlclibrary >=0.0.12
    - einops
    - filelock >=3.12
    - filterpy >=1.4.4
    - huggingface_hub >=0.23
    - imageio-ffmpeg
    - matplotlib-base >=3.3,!=3.7.0,!=3.7.1
    - networkx >=2.6
    - numba >=0.54
    - numpy >=1.22.4
    - opencv
    - packaging >=26
    - pandas >=2.2
    - bottleneck
    - numexpr
    - pillow >=7.1
    - pycocotools
    - pydantic >=2
    - pytables >=3.8.0
    - pytorch >=2
    - pyyaml
    - ruamel.yaml >=0.15.0
    - scikit-image >=0.17
    - scikit-learn >=1.0
    - scipy >=1.10
    - statsmodels >=0.11
    - timm
    - torchvision
    - tqdm
  run_constraints:
    - napari-deeplabcut >=0.2.1.6
    - qtpy >=2.0
    - qdarkstyle >=3.1
    - tensorflow >=2.12
    - tf-keras >=2.15
    - imgaug >=0.4
    - tensorpack >=0.11
    - tf_slim >=1.1

tests:
  - python:
      imports:
        - deeplabcut
        - deeplabcut.pose_estimation_pytorch.data.augmentation
        - deeplabcut.pose_estimation_pytorch.data.transforms
        - deeplabcut.post_processing.filtering
        - deeplabcut.pose_estimation_3d.triangulation
        - deeplabcut.refine_training_dataset.stitch
        - deeplabcut.utils.make_labeled_video
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - dlc --help
    requirements:
      run:
        - python ${{ python_min }}.*
        - opencv *headless*
  - script:
      - python -c "import deeplabcut"
      - python -c "import deeplabcut.pose_estimation_tensorflow"
      - python -c "import deeplabcut.gui.launch_script"
    requirements:
      run:
        - opencv *headless*
        - napari-deeplabcut >=0.2.1.6
        - qtpy >=2.0
        - qdarkstyle >=3.1
        - pyside6
        - tensorflow >=2.12
        - tf-keras >=2.15
        - imgaug >=0.4
        - tensorpack >=0.11
        - tf_slim >=1.1

about:
  license: LGPL-3.0-or-later
  license_file: LICENSE
  summary: DeepLabCut is a toolbox for markerless pose estimation of animals performing various tasks.
  homepage: https://www.deeplabcut.org
  repository: https://github.com/DeepLabCut/DeepLabCut

extra:
  recipe-maintainers:
    - hmaarrfk
